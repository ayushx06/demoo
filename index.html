<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, viewport-fit=cover,
               user-scalable=no">

<title>A Little Surprise for Prakriti</title>

<style>
:root {
    --pink: #ff7fb3;
    --light-pink: #ffd6e7;
    --deep: #16050d;
    --white: #fff7fb;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090308;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: Georgia, "Times New Roman", serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            #3c1329 0%,
            #180811 35%,
            #090308 75%,
            #020102 100%
        );
}

/* =====================================================
   LIGHT
===================================================== */

.glow {
    position: absolute;
    width: 75vmax;
    height: 75vmax;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 117, 170, .28) 0%,
        rgba(255, 80, 145, .10) 35%,
        transparent 70%
    );
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
}

.glow.active {
    opacity: 1;
}

/* =====================================================
   COUNTDOWN
===================================================== */

#countdown {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    pointer-events: none;
}

.number {
    position: absolute;
    color: white;
    font-size: clamp(100px, 30vw, 240px);
    font-weight: 400;
    opacity: 0;
    transform: scale(.35);
    text-shadow:
        0 0 20px white,
        0 0 50px #ff83b7,
        0 0 100px #ff4d96;
}

.number.show {
    animation: numberIn .9s ease forwards;
}

.number.hide {
    animation: numberOut .55s ease forwards;
}

@keyframes numberIn {
    0% {
        opacity: 0;
        transform: scale(.35);
    }

    45% {
        opacity: 1;
        transform: scale(1.08);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes numberOut {
    to {
        opacity: 0;
        transform: scale(1.4);
    }
}

/* =====================================================
   REAL FLOWERS
===================================================== */

#flowers {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

.flower {
    position: absolute;
    object-fit: cover;

    /*
       Important:
       Don't continuously animate blur/filter.
       This saves a LOT of phone GPU power.
    */

    opacity: 0;
    transform: scale(.65) translateY(80px);

    border-radius: 45%;

    box-shadow:
        0 0 35px rgba(255, 90, 160, .18);

    will-change: transform, opacity;
}

.flower.visible {
    animation:
        flowerAppear 2.2s cubic-bezier(.16, 1, .3, 1) forwards,
        flowerFloat 6s ease-in-out 2.2s infinite alternate;
}

@keyframes flowerAppear {

    0% {
        opacity: 0;
        transform: scale(.55) translateY(100px);
    }

    70% {
        opacity: .8;
    }

    100% {
        opacity: .88;
        transform: scale(1) translateY(0);
    }
}

@keyframes flowerFloat {

    from {
        transform: translateY(0) rotate(-1deg);
    }

    to {
        transform: translateY(-7px) rotate(1deg);
    }
}

/* =====================================================
   FLOWER BLUSH
===================================================== */

.flowerBlush {
    position: absolute;
    width: 45vmax;
    height: 45vmax;
    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(255, 100, 165, .18),
        transparent 68%
    );

    pointer-events: none;
    z-index: 7;

    opacity: 0;
    transform: scale(.7);
}

.flowerBlush.active {
    animation: blush 4s ease-in-out infinite alternate;
}

@keyframes blush {

    from {
        opacity: .2;
        transform: scale(.75);
    }

    to {
        opacity: .65;
        transform: scale(1.05);
    }
}

.blushLeft {
    left: -25vmax;
    bottom: -15vmax;
}

.blushRight {
    right: -25vmax;
    bottom: -15vmax;
}

/* =====================================================
   PETALS
===================================================== */

#petals {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
}

.petal {
    position: absolute;

    width: 8px;
    height: 12px;

    border-radius: 70% 0 70% 0;

    background: linear-gradient(
        135deg,
        #ffe1ec,
        #ff91bb
    );

    opacity: 0;

    animation: petalFall linear infinite;
}

@keyframes petalFall {

    0% {
        opacity: 0;
        transform:
            translate3d(0, -12vh, 0)
            rotate(0deg);
    }

    12% {
        opacity: .65;
    }

    88% {
        opacity: .65;
    }

    100% {
        opacity: 0;
        transform:
            translate3d(var(--drift), 115vh, 0)
            rotate(500deg);
    }
}

/* =====================================================
   MAIN TEXT
===================================================== */

#content {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 30;
    pointer-events: none;

    padding: 20px;
}

#loveText {
    color: var(--light-pink);

    font-size: clamp(
        36px,
        9vw,
        68px
    );

    letter-spacing: .12em;

    opacity: 0;
    transform: translateY(20px);

    text-shadow:
        0 0 15px rgba(255, 180, 210, .7),
        0 0 40px rgba(255, 90, 160, .4);
}

#loveText.visible {
    animation: textReveal 1.5s ease forwards;
}

@keyframes textReveal {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#name {
    margin-top: 12px;

    font-size: clamp(
        60px,
        18vw,
        145px
    );

    line-height: .9;

    letter-spacing: .025em;

    font-weight: 400;

    background: linear-gradient(
        110deg,
        #fff,
        #ffd2e5,
        #fff,
        #ff9fc5,
        #fff
    );

    background-size: 250% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    opacity: 0;
    transform: scale(.8);

    text-shadow:
        0 0 50px rgba(255, 120, 175, .4);
}

#name.visible {
    animation:
        nameReveal 1.8s cubic-bezier(.16,1,.3,1) forwards,
        shine 5s linear 1.8s infinite;
}

@keyframes nameReveal {

    0% {
        opacity: 0;
        transform: scale(.8);
    }

    70% {
        opacity: 1;
        transform: scale(1.04);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes shine {

    from {
        background-position: 200% 0;
    }

    to {
        background-position: -50% 0;
    }
}

#heart {
    margin-top: 22px;

    font-size: clamp(
        38px,
        9vw,
        60px
    );

    opacity: 0;

    filter:
        drop-shadow(0 0 15px rgba(255, 80, 150, .8));

    transform: scale(.5);
}

#heart.visible {
    animation:
        heartAppear 1s ease forwards,
        heartbeat 1.7s ease-in-out 1s infinite;
}

@keyframes heartAppear {

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.18);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.1);
    }
}

/* =====================================================
   BUTTONS
===================================================== */

#buttons {
    position: absolute;

    left: 0;
    right: 0;

    bottom:
        max(25px, env(safe-area-inset-bottom));

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 12px;

    z-index: 50;

    opacity: 0;

    padding: 15px;

    pointer-events: none;
}

#buttons.visible {
    animation: buttonsIn 1s ease forwards;
    pointer-events: auto;
}

@keyframes buttonsIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

button {
    appearance: none;
    -webkit-appearance: none;

    border: 1px solid rgba(255,255,255,.4);

    border-radius: 999px;

    padding:
        14px
        20px;

    min-height: 50px;

    color: white;

    font-family: Georgia, serif;

    font-size: 14px;

    background:
        rgba(255,255,255,.11);

    /*
       Removed backdrop-filter.
       It is expensive on many phones.
    */

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);

    cursor: pointer;

    touch-action: manipulation;

    -webkit-user-select: none;
    user-select: none;
}

#yesBtn {
    background:
        linear-gradient(
            135deg,
            #fff,
            #ffe1ed
        );

    color: #d52c70;

    border: none;

    box-shadow:
        0 8px 30px rgba(255, 100, 165, .4);
}

#yesBtn:active {
    transform: scale(.95);
}

#noBtn {
    position: relative;
}

/* =====================================================
   FINAL SCENE
===================================================== */

#finalScene {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            #ffb7d2,
            #ff6fa5 45%,
            #c41c61 100%
        );

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1.5s ease;
}

#finalScene.show {
    opacity: 1;
    visibility: visible;
}

#finalText {
    color: white;

    text-align: center;

    font-size:
        clamp(
            42px,
            12vw,
            95px
        );

    line-height: 1;

    padding: 20px;

    text-shadow:
        0 0 20px white,
        0 0 50px rgba(255,255,255,.8),
        0 0 90px rgba(255, 50, 140, .8);

    animation:
        finalTextIn 2s cubic-bezier(.16,1,.3,1);
}

@keyframes finalTextIn {

    from {
        opacity: 0;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =====================================================
   FINAL HEARTS
===================================================== */

.finalHeart {
    position: absolute;

    color: white;

    font-size: 25px;

    pointer-events: none;

    animation: finalHeart 4s ease-out forwards;
}

@keyframes finalHeart {

    0% {
        opacity: 0;
        transform:
            translate3d(0, 20vh, 0)
            scale(.4);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate3d(var(--x), -90vh, 0)
            scale(1);
    }
}

/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    #loveText {
        font-size: 32px;
        letter-spacing: .08em;
    }

    #name {
        font-size: 58px;
    }

    #heart {
        font-size: 38px;
    }

    #buttons {
        gap: 8px;
    }

    button {
        padding: 12px 15px;
        font-size: 13px;
    }
}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .2s !important;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="glow" id="glow"></div>

    <div id="countdown"></div>

    <div id="flowers"></div>

    <div
        class="flowerBlush blushLeft"
        id="blushLeft">
    </div>

    <div
        class="flowerBlush blushRight"
        id="blushRight">
    </div>

    <div id="petals"></div>

    <div id="content">

        <div id="loveText">
            I LOVE YOU
        </div>

        <div id="name">
            PRAKRITI
        </div>

        <div id="heart">
            ❤
        </div>

    </div>

    <div id="buttons">

        <button id="yesBtn">
            I LOVE YOU TOO ❤
        </button>

        <button id="noBtn">
            Sorry
        </button>

    </div>

    <div id="finalScene">

        <div id="finalText">
            I LOVE YOU TOO ❤
        </div>

    </div>

</div>


<script>
"use strict";

/* =====================================================
   DEVICE
===================================================== */

const isMobile =
    window.innerWidth < 700 ||
    /Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );


/* =====================================================
   ELEMENTS
===================================================== */

const countdown =
    document.getElementById("countdown");

const glow =
    document.getElementById("glow");

const flowers =
    document.getElementById("flowers");

const petals =
    document.getElementById("petals");

const loveText =
    document.getElementById("loveText");

const nameText =
    document.getElementById("name");

const heart =
    document.getElementById("heart");

const buttons =
    document.getElementById("buttons");

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const finalScene =
    document.getElementById("finalScene");

const blushLeft =
    document.getElementById("blushLeft");

const blushRight =
    document.getElementById("blushRight");


/* =====================================================
   REAL FLOWER PHOTOS
===================================================== */

const flowerImages = [

    "https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=700&q=75",

    "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=700&q=75",

    "https://images.unsplash.com/photo-1522748906645-95d8adfd52c7?w=700&q=75",

    "https://images.unsplash.com/photo-1560717845-968823efbee1?w=700&q=75"

];


/* =====================================================
   FLOWER POSITIONS
===================================================== */

const mobilePositions = [

    {
        left: "-12vw",
        bottom: "-5vw",
        width: "45vw",
        rotate: "-8deg"
    },

    {
        right: "-13vw",
        bottom: "-3vw",
        width: "44vw",
        rotate: "8deg"
    },

    {
        left: "-10vw",
        top: "-8vw",
        width: "34vw",
        rotate: "8deg"
    },

    {
        right: "-10vw",
        top: "-7vw",
        width: "35vw",
        rotate: "-8deg"
    }

];

const desktopPositions = [

    {
        left: "-5vw",
        bottom: "-4vw",
        width: "30vw",
        rotate: "-8deg"
    },

    {
        right: "-5vw",
        bottom: "-3vw",
        width: "29vw",
        rotate: "8deg"
    },

    {
        left: "-4vw",
        top: "-4vw",
        width: "23vw",
        rotate: "8deg"
    },

    {
        right: "-4vw",
        top: "-3vw",
        width: "23vw",
        rotate: "-8deg"
    },

    {
        left: "18vw",
        bottom: "-10vw",
        width: "21vw",
        rotate: "-5deg"
    },

    {
        right: "17vw",
        bottom: "-10vw",
        width: "21vw",
        rotate: "5deg"
    }

];


/* =====================================================
   CREATE FLOWERS
===================================================== */

function createFlowers() {

    const positions =
        isMobile
            ? mobilePositions
            : desktopPositions;

    positions.forEach(
        (position, index) => {

            const img =
                document.createElement("img");

            img.className = "flower";

            img.src =
                flowerImages[
                    index %
                    flowerImages.length
                ];

            img.alt = "";

            img.loading = "eager";

            img.decoding = "async";

            Object.assign(
                img.style,
                {
                    left: position.left || "auto",
                    right: position.right || "auto",
                    top: position.top || "auto",
                    bottom: position.bottom || "auto",
                    width: position.width,
                    height: `calc(${position.width} * 1.15)`
                }
            );

            img.dataset.rotate =
                position.rotate;

            flowers.appendChild(img);

            /*
               Stagger the flowers.
            */

            setTimeout(
                () => {

                    img.style.transform =
                        `scale(1) translateY(0) rotate(${position.rotate})`;

                    img.classList.add("visible");

                },
                500 + index * 280
            );

        }
    );
}


/* =====================================================
   PETALS
===================================================== */

function createPetals() {

    /*
       MUCH fewer on phones.
    */

    const amount =
        isMobile ? 8 : 14;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const petal =
            document.createElement("div");

        petal.className =
            "petal";

        petal.style.left =
            Math.random() * 100 + "vw";

        petal.style.setProperty(
            "--drift",
            (Math.random() * 120 - 60) + "px"
        );

        petal.style.animationDuration =
            (8 + Math.random() * 7) + "s";

        petal.style.animationDelay =
            (-Math.random() * 10) + "s";

        petal.style.transform =
            `scale(${.6 + Math.random() * .8})`;

        petals.appendChild(petal);

    }
}


/* =====================================================
   COUNTDOWN
===================================================== */

function showNumber(value) {

    return new Promise(
        resolve => {

            const number =
                document.createElement("div");

            number.className =
                "number";

            number.textContent =
                value;

            countdown.appendChild(number);

            requestAnimationFrame(
                () => {
                    number.classList.add("show");
                }
            );

            setTimeout(
                () => {

                    number.classList.remove(
                        "show"
                    );

                    number.classList.add(
                        "hide"
                    );

                    setTimeout(
                        () => {
                            number.remove();
                            resolve();
                        },
                        500
                    );

                },
                700
            );

        }
    );
}


/* =====================================================
   START EXPERIENCE
===================================================== */

async function startExperience() {

    await showNumber("3");

    await showNumber("2");

    await showNumber("1");

    enterWorld();
}


/* =====================================================
   ENTER FLOWER WORLD
===================================================== */

function enterWorld() {

    glow.classList.add("active");

    blushLeft.classList.add("active");

    blushRight.classList.add("active");

    createFlowers();

    createPetals();

    /*
       Give the flowers time to appear
       before revealing the message.
    */

    setTimeout(
        revealMessage,
        1700
    );
}


/* =====================================================
   REVEAL MESSAGE
===================================================== */

function revealMessage() {

    loveText.classList.add("visible");

    setTimeout(
        () => {
            nameText.classList.add(
                "visible"
            );
        },
        700
    );

    setTimeout(
        () => {

            heart.classList.add(
                "visible"
            );

        },
        1700
    );

    setTimeout(
        () => {

            buttons.classList.add(
                "visible"
            );

        },
        2700
    );
}


/* =====================================================
   RUNAWAY SORRY BUTTON
===================================================== */

let escapeCount = 0;

function moveSorry() {

    escapeCount++;

    const rect =
        noBtn.getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;

    const padding = 15;

    const maxX =
        Math.max(
            padding,
            window.innerWidth -
            width -
            padding
        );

    const maxY =
        Math.max(
            padding,
            window.innerHeight -
            height -
            padding
        );

    /*
       On phones, keep it away from
       the bottom navigation area.
    */

    const safeBottom =
        isMobile
            ? 100
            : 20;

    const availableY =
        Math.max(
            padding,
            window.innerHeight -
            height -
            safeBottom
        );

    const x =
        padding +
        Math.random() *
        Math.max(
            1,
            maxX - padding
        );

    const y =
        padding +
        Math.random() *
        Math.max(
            1,
            availableY - padding
        );

    noBtn.style.position =
        "fixed";

    noBtn.style.left =
        x + "px";

    noBtn.style.top =
        y + "px";

    noBtn.style.transform =
        `rotate(${Math.random() * 16 - 8}deg) scale(.95)`;

    setTimeout(
        () => {

            noBtn.style.transform =
                "rotate(0deg) scale(1)";

        },
        250
    );
}


/* =====================================================
   DESKTOP SORRY DETECTION
===================================================== */

if (!isMobile) {

    let lastEscape = 0;

    document.addEventListener(
        "mousemove",
        event => {

            const now =
                performance.now();

            /*
               Don't run continuously.
            */

            if (
                now - lastEscape < 250
            ) {
                return;
            }

            const rect =
                noBtn.getBoundingClientRect();

            const centerX =
                rect.left +
                rect.width / 2;

            const centerY =
                rect.top +
                rect.height / 2;

            const distance =
                Math.hypot(
                    event.clientX - centerX,
                    event.clientY - centerY
                );

            if (distance < 90) {

                lastEscape = now;

                moveSorry();

            }

        },
        {
            passive: true
        }
    );

}


/* =====================================================
   MOBILE SORRY
===================================================== */

noBtn.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        moveSorry();

    },
    {
        passive: false
    }
);


/*
   Desktop click protection.
*/

noBtn.addEventListener(
    "click",
    event => {

        event.preventDefault();

        moveSorry();

    }
);


/* =====================================================
   YES BUTTON
===================================================== */

yesBtn.addEventListener(
    "click",
    triggerFinalScene
);


/* =====================================================
   FINAL SCENE
===================================================== */

function triggerFinalScene() {

    buttons.style.opacity = "0";

    buttons.style.pointerEvents =
        "none";

    /*
       Hide original text.
    */

    document.getElementById(
        "content"
    ).style.opacity = "0";

    /*
       Make flowers brighter
       WITHOUT continuously using filters.
    */

    document.querySelectorAll(
        ".flower"
    ).forEach(
        flower => {

            flower.style.opacity =
                "1";

            flower.style.transform =
                "scale(1.05)";

        }
    );

    /*
       Final scene.
    */

    setTimeout(
        () => {

            finalScene.classList.add(
                "show"
            );

            createFinalHearts();

        },
        500
    );

}


/* =====================================================
   FINAL HEARTS
===================================================== */

function createFinalHearts() {

    const amount =
        isMobile ? 18 : 30;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        setTimeout(
            () => {

                const h =
                    document.createElement("div");

                h.className =
                    "finalHeart";

                h.textContent =
                    "❤";

                h.style.left =
                    Math.random() * 100 +
                    "vw";

                h.style.bottom =
                    "-30px";

                h.style.fontSize =
                    (14 +
                    Math.random() * 25) +
                    "px";

                h.style.setProperty(
                    "--x",
                    (Math.random() * 160 - 80) +
                    "px"
                );

                finalScene.appendChild(h);

                setTimeout(
                    () => h.remove(),
                    4500
                );

            },
            i * 120
        );

    }

}


/* =====================================================
   INITIALIZATION
===================================================== */

/*
   Start automatically.

   No document-wide touch listener,
   so tapping buttons later won't
   accidentally restart the animation.
*/

setTimeout(
    startExperience,
    700
);

</script>
